name: Build & Tests
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            node-version: '18'
            cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Example Prebuild
        working-directory: ./example
        run: npx expo prebuild --clean
